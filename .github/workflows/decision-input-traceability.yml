name: Decision input traceability

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  decision-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.1.1
      - run: python -m pytest -q -rs test_decision_input_traceability.py test_df011_provenance.py
