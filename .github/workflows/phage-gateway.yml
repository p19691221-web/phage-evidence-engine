name: PHAGE Gateway

on:
  pull_request:
  push:
    branches:
      - main
      - phage-gateway-mvp
      - phage-gateway-execution
      - phage-tool-adapter
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway-regression:
    name: PHAGE Gateway regression
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run PHAGE Gateway regression
        run: python3 test_phage_gateway.py

      - name: Run PHAGE execution-boundary regression
        run: python3 test_phage_executor.py
      - name: Run PHAGE tool-adapter regression
        run: python3 test_phage_tool_adapter.py
