name: Authority Engine regression

on:
  push:
    paths:
      - "test_phage_authority_engine_v0_1.py"
      - "phage_authority_engine_v0_1.py"
      - ".github/workflows/authority-engine.yml"
  pull_request:
    paths:
      - "test_phage_authority_engine_v0_1.py"
      - "phage_authority_engine_v0_1.py"
      - ".github/workflows/authority-engine.yml"

jobs:
  authority-engine-regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Authority Engine regression A-F
        run: python test_phage_authority_engine_v0_1.py
