name: Authority-to-Execution Binding regression

on:
  push:
    paths:
      - "test_phage_authority_execution_binding_v0_1.py"
      - "phage_authority_execution_binding_v0_1.py"
      - "phage_authority_engine_v0_1.py"
      - ".github/workflows/authority-execution-binding.yml"

  pull_request:
    paths:
      - "test_phage_authority_execution_binding_v0_1.py"
      - "phage_authority_execution_binding_v0_1.py"
      - "phage_authority_engine_v0_1.py"
      - ".github/workflows/authority-execution-binding.yml"

jobs:
  authority-execution-binding-regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Authority-to-Execution Binding regression A-E
        run: python test_phage_authority_execution_binding_v0_1.py
