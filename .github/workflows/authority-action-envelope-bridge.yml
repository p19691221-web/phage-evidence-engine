name: Authority-to-ActionEnvelope Bridge regression

on:
  push:
    paths:
      - "test_phage_authority_action_envelope_bridge_v0_1.py"
      - "phage_authority_action_envelope_bridge_v0_1.py"
      - ".github/workflows/authority-action-envelope-bridge.yml"

  pull_request:
    paths:
      - "test_phage_authority_action_envelope_bridge_v0_1.py"
      - "phage_authority_action_envelope_bridge_v0_1.py"
      - ".github/workflows/authority-action-envelope-bridge.yml"

jobs:
  authority-action-envelope-bridge-regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Authority-to-ActionEnvelope Bridge regression A-G
        run: python test_phage_authority_action_envelope_bridge_v0_1.py
