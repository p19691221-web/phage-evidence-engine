name: DF-011 provenance boundary

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  df011:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.1.1
      - run: python -m pytest -q -s test_df011_provenance.py
